<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OneLine Diary</title>

    <link rel="stylesheet" href="./src/css/common.css">
    <link rel="stylesheet" href="./src/css/style.css">

    <script src="./src/js/db.js"></script>
    <script src="./src/js/index.js"></script>
    <script src="./src/js/menuStatus.js"></script>
    <script src="./src/js/signInedSession.js"></script>
    <script src="./src/js/util.js"></script>
    <script src="./src/js/viewChange.js"></script>
</head>
<body>
    
    <div id="wrap">

        <div class="title_wrap">
            Oneline Diary
        </div>

        <div class="menu_wrap">
            <a class="sign_up" href="#none">Sign Up</a>
            <a class="sign_in" href="#none">Sign In</a>
            <a class="sign_out" href="#none">Sign Out</a>
            <a class="write" href="#none">Write</a>
            <a class="list" href="#none">List</a>
        </div>

        <div class="sign_up_wrap">
            <input type="text" name="u_id" placeholder="ID 입력">
            <br>
            <input type="password" name="u_pw" placeholder="PW 입력">
            <br>
            <input type="text" name="u_mail" placeholder="MAIL 입력">
            <br>
            <input type="button" value="SIGN UP">
        </div>

        <div class="sign_in_wrap">
            <input type="text" name="u_id" placeholder="ID 입력">
            <br>
            <input type="password" name="u_pw" placeholder="PW 입력">
            <br>
            <input type="button" value="SIGN IN">
        </div>

        <div class="write_wrap">
            <input type="text"><button>WRITE</button>
        </div>

        <div class="list_wrap">

        </div>

    </div>

</body>
</html>

<template id="list_item">
    <div class="txt">

    </div>
</template>
